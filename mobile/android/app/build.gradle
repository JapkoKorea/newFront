plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def readEnvKeyFromFile(String relativePath, String key) {
    def envFile = rootProject.file(relativePath)
    if (!envFile.exists()) {
        return ""
    }

    for (def line : envFile.readLines()) {
        def trimmed = line.trim()
        if (!trimmed || trimmed.startsWith("#") || !trimmed.contains("=")) {
            continue
        }

        def idx = trimmed.indexOf("=")
        def k = trimmed.substring(0, idx).trim()
        if (k != key) {
            continue
        }

        def value = trimmed.substring(idx + 1).trim()
        if ((value.startsWith('"') && value.endsWith('"')) ||
            (value.startsWith("'") && value.endsWith("'"))) {
            value = value.substring(1, value.length() - 1)
        }
        return value
    }

    return ""
}

def resolvedMapsApiKey =
    (project.findProperty("MAPS_API_KEY") ?: "") ?: ""

if (!resolvedMapsApiKey) {
    resolvedMapsApiKey = (System.getenv("MAPS_API_KEY") ?: "")
}
if (!resolvedMapsApiKey) {
    resolvedMapsApiKey = (System.getenv("NEXT_PUBLIC_GOOGLE_MAPS_KEY") ?: "")
}
if (!resolvedMapsApiKey) {
    resolvedMapsApiKey = readEnvKeyFromFile("../.env.local", "NEXT_PUBLIC_GOOGLE_MAPS_KEY")
}
if (!resolvedMapsApiKey) {
    resolvedMapsApiKey = readEnvKeyFromFile("../.env", "NEXT_PUBLIC_GOOGLE_MAPS_KEY")
}
if (!resolvedMapsApiKey) {
    resolvedMapsApiKey = readEnvKeyFromFile("../../.env.local", "NEXT_PUBLIC_GOOGLE_MAPS_KEY")
}
if (!resolvedMapsApiKey) {
    resolvedMapsApiKey = readEnvKeyFromFile("../../.env", "NEXT_PUBLIC_GOOGLE_MAPS_KEY")
}

android {
    namespace = "com.japkotour.mobile"
    compileSdk = 35
    ndkVersion = "25.1.8937393"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.japkotour.mobile"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        manifestPlaceholders += [
            MAPS_API_KEY: resolvedMapsApiKey
        ]
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
