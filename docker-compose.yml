# 잽코 택시투어 API 서버 배포 구성.
#
# 웹(Next.js)은 Vercel 에서 서빙하므로 여기에는 API 만 올린다.
# DB 는 기존 japko_local 을 그대로 사용한다(호스트의 MySQL 또는 별도 관리형 DB).
#
# 사용법:
#   cp .env.example .env   # 값 채우기
#   docker compose up -d --build
#   docker compose logs -f api

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: japko-taxi-api:latest
    container_name: japko-taxi-api
    restart: unless-stopped
    # .env 의 값을 그대로 컨테이너 환경변수로 주입한다.
    env_file:
      - .env
    environment:
      # 컨테이너에서 호스트의 MySQL 에 붙을 때 사용한다.
      # 관리형 DB 를 쓰면 .env 의 MYSQL_HOST 가 우선하도록 이 줄을 지운다.
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
    ports:
      - "8000:8000"
    extra_hosts:
      # 리눅스 호스트에서 host.docker.internal 을 쓰기 위해 필요하다.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/courses')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
