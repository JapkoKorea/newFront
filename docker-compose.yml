# 잽코 택시투어 전체 배포 구성 (서버 1대).
#
#   [브라우저] --443--> [caddy] --> web:3000  (Next.js)
#                              \--> api:8000  (FastAPI) --> MySQL
#
# 사용법:
#   cp .env.example .env      # 값 채우기 (WEB_DOMAIN, API_DOMAIN 포함)
#   docker compose up -d --build
#   docker compose logs -f
#
# MySQL 은 이 구성에 포함하지 않는다. 호스트의 MySQL 또는 RDS 를
# .env 의 MYSQL_HOST 로 지정한다.

services:
  caddy:
    image: caddy:2-alpine
    container_name: japko-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:-localhost}
      API_DOMAIN: ${API_DOMAIN:-localhost:8443}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # 발급받은 인증서. 지우면 재발급되므로 유지할 것
      - caddy_config:/config
    depends_on:
      - web
      - api

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* 는 빌드 시점에 번들에 박히므로 build-arg 로 넘긴다.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_KEY}
        NEXT_PUBLIC_KAKAO_CLIENT_ID: ${NEXT_PUBLIC_KAKAO_CLIENT_ID}
        NEXT_PUBLIC_KAKAO_REDIRECT_URI: ${NEXT_PUBLIC_KAKAO_REDIRECT_URI}
    image: japko-taxi-web:latest
    container_name: japko-taxi-web
    restart: unless-stopped
    expose:
      - "3000"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: japko-taxi-api:latest
    container_name: japko-taxi-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 호스트에 설치된 MySQL 에 붙을 때 사용한다.
      # RDS 등 외부 DB 를 쓰면 .env 의 MYSQL_HOST 가 그대로 적용된다.
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/courses')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  caddy_data:
  caddy_config:
